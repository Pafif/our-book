<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#240a12">
<meta name="description" content="Our book: the story, photos, notes, places and plans of the two of us.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Our Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* Layout idea: one wine-red book on a night sky, lit by a candle. Pages are dark wine card;
   everything the two of you add (photos, notes) is warm blush paper that glows on them. */
:root{
  color-scheme:dark;
  --night:#0c0407;
  --night-2:#240a12;
  --page:#2b0e17;
  --page-edge:#3c1522;
  --page-deep:#1b070d;
  --ink:#f7e7d8;
  --ink-soft:#c5a49d;
  --ember:#f1c481;
  --ember-rgb:241,196,129;
  --rose:#e5566d;
  --rose-rgb:229,86,109;
  --paper:#f4e4d6;
  --paper-ink:#36121c;
  --line:rgba(247,231,216,.15);
  --display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --body:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --hand:"Parisienne","Segoe Script","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(110% 85% at 50% 55%,var(--night-2),var(--night) 72%);
  color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;font-size-adjust:.45;line-height:1.5;
  font-variant-numeric:lining-nums;   /* full-height numerals that sit on the line, instead of the font's default old-style ones that dip below it */
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top,.stage,.tabs{position:relative;z-index:1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
/* no blue tap flash on phones; a gentle press in the book's own colours instead */
*{-webkit-tap-highlight-color:transparent}
button,a,label,.ph img,.thumb img{touch-action:manipulation}
.btn:active,.arrow:active:not([disabled]),.edit:active,.tabs a:active,.seg label:active span{transform:scale(.94);transition-duration:.08s}
.btn:active{background:rgba(var(--ember-rgb),.22)}
.btn.solid:active{background:#d94a61}
.tabs a:active,.edit:active{color:var(--ember)}
.toc a:active::before{opacity:1}
@media (hover:none){.btn:hover{transform:none;box-shadow:none}.btn:not(.solid):hover{background:none}.btn.solid:hover{background:var(--rose)}.arrow:hover:not([disabled]){transform:none;border-color:var(--line);color:var(--ink)}}
h1,h2,h3{font-family:var(--display);font-size-adjust:none;font-weight:400;margin:0;text-wrap:balance}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 20px 4px}
.brand{font-family:var(--display);font-size-adjust:none;font-size:18px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#status{font-size:13px;color:var(--ink-soft);font-style:italic;text-align:right}
.acts{display:flex;align-items:baseline;justify-content:flex-end;gap:12px;flex-wrap:wrap;min-width:0}
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,3,6,.55)}
#gate[hidden]{display:none}
.gate-card{width:min(380px,100%);background:linear-gradient(160deg,#6d1429,#3f0b18 55%,#24060e);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(var(--ember-rgb),.3),0 30px 70px rgba(0,0,0,.7);padding:28px 26px}
.gate-card h2{font-size:30px;color:var(--ember);letter-spacing:.04em}
.gate-card .f input{background:rgba(12,4,7,.6)}
#g-err{color:#ffb3bf;font-size:15px;margin:0}
#g-err:empty{display:none}

.stage{container-type:size;display:flex;align-items:center;justify-content:center;padding:14px 22px;min-height:0}
.book{position:relative;width:min(100cqw,150cqh,1080px);width:round(down,min(100cqw,150cqh,1080px),24px);aspect-ratio:3/2;transition:transform 1.25s cubic-bezier(.45,0,.2,1)}
/* closed, the book is just its cover, so it sits in the middle; opening slides it over as the cover swings */
.book.closed{transform:translateX(-25%)}
.board-l{position:absolute;top:-7px;bottom:-7px;left:-9px;right:50%;border-radius:9px 0 0 9px;background:linear-gradient(160deg,#641326,#48101c);box-shadow:0 30px 60px rgba(0,0,0,.7);transform-origin:100% 50%}
.book.closed .board-l{transform:scaleX(0)}
.book::before{content:"";position:absolute;inset:-7px -9px -7px 50%;border-radius:0 9px 9px 0;background:linear-gradient(160deg,#48101c,#2c0711);box-shadow:0 30px 60px rgba(0,0,0,.7)}
.book::after{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 24px);width:48px;z-index:6;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.4) 47%,rgba(0,0,0,.4) 53%,transparent);transition:opacity .5s}
.book.closed::after{opacity:0}
.spread{position:absolute;inset:0;perspective:2600px}
.book.closed .glow{transform:translateX(20%)}
.glow{position:absolute;inset:-12%;z-index:7;pointer-events:none;will-change:opacity;transition:transform 1.25s cubic-bezier(.45,0,.2,1);
  background:radial-gradient(42% 46% at 50% 44%,rgba(var(--ember-rgb),.09),rgba(var(--rose-rgb),.05) 55%,transparent 75%);
  animation:flicker 5.5s ease-in-out infinite}
.book.turning .glow,.book.turning .star,.book.turning .dayno{animation-play-state:paused}
@keyframes flicker{0%,100%{opacity:.85}18%{opacity:1}31%{opacity:.78}47%{opacity:.96}63%{opacity:.82}80%{opacity:1}}

.page{
  position:absolute;top:0;height:100%;width:50%;background:var(--page);
  padding:26px 30px 34px;display:flex;flex-direction:column;gap:14px;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  will-change:transform;
}
.page.left{left:0;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--page-edge),var(--page) 6%,var(--page) 86%,var(--page-deep))}
.page.right{left:50%;border-radius:0 6px 6px 0;background:linear-gradient(270deg,var(--page-edge),var(--page) 6%,var(--page) 86%,var(--page-deep))}
.page.single{left:0;width:100%;border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.65)}
.page.void{visibility:hidden}
.folio{position:absolute;bottom:10px;font-size:12px;color:var(--ink-soft);font-variant-numeric:lining-nums tabular-nums}
.left .folio{left:30px}.right .folio,.single .folio{right:30px}

/* the turning leaf. It is cut into narrow strips hinged to each other, so a page can bend like paper:
   its free edge lifts first and lands first. Each strip shows a slice of the page on both sides. */
.turn{position:absolute;top:0;height:100%;width:50%;z-index:4;transform-style:preserve-3d;pointer-events:none}
.turn.fwd{left:50%}.turn.bwd{left:0}
.strip{position:absolute;top:0;height:100%;transform-style:preserve-3d;will-change:transform}
.turn.fwd .strip{transform-origin:0 50%}.turn.bwd .strip{transform-origin:100% 50%}
.sf{position:absolute;top:0;height:100%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sf.rev{transform-origin:0 0}
.sw{position:absolute;top:0;height:100%}
.sd,.sl{position:absolute;inset:0;opacity:0;pointer-events:none}
.sd{background:#000}.sl{background:#ffe0c2}
.held{visibility:hidden}
.cast{position:absolute;top:0;height:100%;width:50%;z-index:3;pointer-events:none;opacity:0;will-change:transform,opacity}
.cast.r{left:50%;transform-origin:0 50%;background:linear-gradient(90deg,rgba(0,0,0,.8) 0 68%,transparent)}
.cast.l{left:0;transform-origin:100% 50%;background:linear-gradient(270deg,rgba(0,0,0,.8) 0 68%,transparent)}
.dust{position:absolute;inset:0;z-index:8;pointer-events:none}
.dust i{position:absolute;border-radius:50%;opacity:0;background:#ffe9c2;box-shadow:0 0 8px 2px rgba(var(--ember-rgb),.8)}
.dust i.r{background:#ffd3d9;box-shadow:0 0 8px 2px rgba(var(--rose-rgb),.85)}
/* phones show one page at a time and use a simple single leaf */
.leaf{position:absolute;top:0;height:100%;z-index:4;transform-style:preserve-3d;will-change:transform}
.leaf.one{left:0;width:100%;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face .page{left:0;width:100%}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:6px}
.one .shade{background:linear-gradient(90deg,rgba(0,0,0,.1),rgba(0,0,0,.7))}

/* cover */
.page.cover{
  background:
    radial-gradient(90% 70% at 28% 22%,rgba(var(--rose-rgb),.22),transparent 62%),
    linear-gradient(160deg,#6d1429,#3f0b18 55%,#24060e);
  border-radius:4px 10px 10px 4px;justify-content:center;align-items:flex-start;gap:16px;overflow:hidden;
  padding:9% 10%;box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(var(--ember-rgb),.2);
}
.page.single.cover{box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(var(--ember-rgb),.2),0 24px 50px rgba(0,0,0,.65)}
.page.cover::after{content:"";position:absolute;inset:16px;border:1px solid rgba(var(--ember-rgb),.4);border-radius:3px 7px 7px 3px;pointer-events:none}
.cover h1{width:100%;font-size:64px;line-height:.98;color:var(--ember);letter-spacing:-.01em;text-shadow:0 0 28px rgba(var(--ember-rgb),.25)}
.cover .names{max-width:100%;font-family:var(--hand);font-size-adjust:none;font-size:clamp(22px,3.2cqw,34px);line-height:1.1;overflow-wrap:anywhere}
.cover .since{color:var(--ink-soft);font-style:italic}
.cover svg{width:24%;min-width:70px;align-self:flex-end;flex:none;overflow:visible}

.star{transform-box:fill-box;transform-origin:center;animation:twinkle 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.53s)}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}

.btn{background:none;border:1px solid var(--ember);color:var(--ember);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:15px;
  transition:background .25s,transform .25s,box-shadow .25s,color .25s}.btn:hover{background:rgba(var(--ember-rgb),.14);transform:translateY(-1px);box-shadow:0 6px 18px rgba(var(--ember-rgb),.18)}
.btn.solid{background:var(--rose);border-color:var(--rose);color:#fff4ee;font-weight:500}.btn.solid:hover{background:#ee6d82;box-shadow:0 8px 24px rgba(var(--rose-rgb),.45)}
.btn.quiet{border-color:var(--line);color:var(--ink-soft)}
.btn.small{padding:3px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.sec{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec h2{font-size:clamp(26px,3.6cqw,38px);line-height:1.05}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.running{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.empty{color:var(--ink-soft);font-style:italic;max-width:36ch;margin:0}
/* the line under the heart: centred beneath it, lines of even length */
.heartnote{max-width:40ch;margin:0 auto;text-align:center;text-wrap:balance;font-size:17px;line-height:1.45}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.ghost{opacity:.55}
.edit{background:none;border:0;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}.edit:hover{color:var(--ember)}
.paper .edit{color:#8a6a70}.book:not(.nohover) .paper .edit:hover{color:#b3243c}

/* dedication */
.dayno{font-family:var(--display);font-size-adjust:none;font-size:clamp(54px,9cqw,96px);line-height:1;font-variant-numeric:lining-nums tabular-nums;
  background:linear-gradient(100deg,var(--ember) 20%,#fff1d6 45%,var(--rose) 70%,var(--ember));background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.ded{display:flex;flex-direction:column;gap:10px;justify-content:center;flex:1}
.ded .names{font-family:var(--hand);font-size-adjust:none;font-size:34px;line-height:1.1;overflow-wrap:anywhere}

/* contents */
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;flex:1;justify-content:space-evenly}
.enter .toc li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 55ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.toc a{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),background .35s}
.toc a::before{content:"";position:absolute;inset:0;border-radius:10px;opacity:0;transition:opacity .35s;
  background:linear-gradient(90deg,rgba(var(--rose-rgb),.22),rgba(var(--ember-rgb),.08) 60%,transparent);box-shadow:inset 0 0 0 1px rgba(var(--ember-rgb),.2)}
.toc .mark{position:relative;flex:none;width:22px;height:22px;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .35s}
.toc .mark path{fill:var(--ink-soft);transition:fill .35s}
.toc .t{display:contents}
/* star, title, line and count share one line, centred on the title; the description has its own row below,
   always reserved, so nothing moves when it fades in */
.toc a{display:grid;grid-template-columns:22px auto minmax(16px,1fr) auto;column-gap:12px;row-gap:2px;align-items:center}
.toc .mark{grid-column:1;grid-row:1}
.toc .t b{grid-column:2;grid-row:1;position:relative;min-width:0;transition:color .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
.toc .t i{grid-column:2 / 5;grid-row:2;position:relative}
.toc .dots{grid-column:3;grid-row:1}
.toc .n{grid-column:4;grid-row:1}
.toc .t b{font-family:var(--display);font-size-adjust:none;font-weight:400;font-size:clamp(18px,2.2cqw,23px);line-height:1.15}
/* the description always keeps its place and only fades in, so hovering never changes a row's size */
.toc .t i{font-size:13.5px;color:var(--ink-soft);opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s}
.toc .dots{position:relative;flex:1;min-width:16px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--line) 0 40%,var(--ember) 50%,var(--line) 60% 100%);background-size:300% 100%;background-position:100% 0}
.toc .n{position:relative;font-size:13px;color:var(--ink-soft);font-variant-numeric:lining-nums tabular-nums;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;transition:color .35s,border-color .35s,background .35s}/* the row itself stays still; only what is inside it moves,so the pointer can never fall off its edge */
.book:not(.nohover) .toc a:hover .t b,.toc a:focus-visible .t b{transform:translateX(6px)}.book:not(.nohover) .toc a:hover::before,.toc a:focus-visible::before{opacity:1}.book:not(.nohover) .toc a:hover .mark,.toc a:focus-visible .mark{transform:translateX(3px) rotate(144deg) scale(1.35);filter:drop-shadow(0 0 8px var(--ember))}.book:not(.nohover) .toc a:hover .mark path,.toc a:focus-visible .mark path{fill:var(--ember)}.book:not(.nohover) .toc a:hover .t b,.toc a:focus-visible .t b{color:var(--ember)}.book:not(.nohover) .toc a:hover .t i,.toc a:focus-visible .t i{opacity:1;transform:translateX(6px)}.book:not(.nohover) .toc a:hover .dots,.toc a:focus-visible .dots{animation:run 1.3s linear infinite}
@keyframes run{from{background-position:100% 0}to{background-position:0 0}}.book:not(.nohover) .toc a:hover .n,.toc a:focus-visible .n{color:#fff4ee;border-color:var(--rose);background:rgba(var(--rose-rgb),.35)}

/* story */
.thread{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line)}
.thread li{position:relative;display:flex;gap:14px;align-items:flex-start;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.thread li::before{content:"";position:absolute;left:-27px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 12px 2px rgba(var(--ember-rgb),.6);transition:transform .35s,box-shadow .35s,background .35s}.book:not(.nohover) .thread li:hover{transform:translateX(6px)}.book:not(.nohover) .thread li:hover::before{transform:scale(1.7);background:var(--rose);box-shadow:0 0 18px 5px rgba(var(--rose-rgb),.7)}.book:not(.nohover) .thread li:hover h3{color:var(--ember)}
.thread .txt{flex:1;min-width:0}
.thread .when{font-size:13px;color:var(--ink-soft);font-variant-numeric:lining-nums tabular-nums}
.thread h3{font-size:22px;line-height:1.15;margin:2px 0 4px;transition:color .35s;overflow-wrap:anywhere}
.thread p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.thumb{flex:none;width:84px;height:84px;background:var(--paper);padding:4px;transform:rotate(2deg);box-shadow:0 6px 14px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.2,.7,.2,1)}.book:not(.nohover) .thread li:hover .thumb{transform:rotate(-2deg) scale(1.12)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* photos */
/* Photos are never cropped: each frame takes its photo's own shape, sized by fitShots() to the space it has.
   Tall photos get a page each; wide ones share a page two by two. */
.shots{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.slot{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.paper{background:var(--paper);color:var(--paper-ink);box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 30px rgba(var(--rose-rgb),.12);
  transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.shot{margin:0;padding:9px 9px 6px;display:flex;flex-direction:column;gap:4px}
.slot:nth-child(odd) .shot{transform:rotate(-1.6deg)}.slot:nth-child(even) .shot{transform:rotate(1.3deg)}.book:not(.nohover) .shots .shot:hover,.book:not(.nohover) .notes .note:hover{transform:rotate(0) translateY(-6px) scale(1.035);box-shadow:0 22px 40px rgba(0,0,0,.6),0 0 46px rgba(var(--rose-rgb),.35);z-index:2}
.ph{flex:none;width:240px;height:180px;background:#d9c3b6;display:flex;align-items:center;justify-content:center;color:#7d5f5c;font-style:italic;font-size:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .8s cubic-bezier(.2,.7,.2,1)}.book:not(.nohover) .shot:hover .ph img{transform:scale(1.04)}
.thumb img{cursor:zoom-in}
.ph.missing img{display:none}.ph.missing::after{content:"This photo can't be shown here"}
.shot figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.shot .cap{font-family:var(--hand);font-size-adjust:none;font-size:23px;line-height:1.1;overflow-wrap:anywhere}
.shot .meta{font-size:12px;color:#7a5a60}

/* notes */
.notes{display:flex;flex-direction:column;gap:20px}
.note{position:relative;padding:16px 18px 12px;max-width:42ch}
.note:nth-child(odd){transform:rotate(-1deg);align-self:flex-start}.note:nth-child(even){transform:rotate(1.2deg);align-self:flex-end}
.note p{margin:0 0 8px;font-family:var(--hand);font-size-adjust:none;font-size:24px;line-height:1.22;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#7a5a60}

/* places */
.skymap{flex:1;min-height:180px;width:100%;overflow:visible}
.skymap text{font-family:var(--body);font-size:11px;fill:var(--ink-soft)}
.skymap .count{font-family:var(--display);font-size-adjust:none;font-size:44px;fill:var(--ember)}
.skymap .lit{transition:r .3s}
.skymap g.hot .halo{fill:rgba(var(--rose-rgb),.55)}
.skymap g.hot text{fill:var(--ember);font-size:13px}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.places li{display:flex;gap:12px;align-items:baseline;padding:6px 8px;border-radius:8px;transition:background .3s,transform .35s cubic-bezier(.2,.7,.2,1)}.book:not(.nohover) .places li:hover{background:rgba(var(--rose-rgb),.16);transform:translateX(6px)}
.places .num{font-family:var(--display);font-size-adjust:none;color:var(--ember);min-width:1.6em;font-variant-numeric:lining-nums tabular-nums;transition:text-shadow .3s}.book:not(.nohover) .places li:hover .num{text-shadow:0 0 12px var(--ember)}
.places .txt{flex:1;min-width:0}
.places strong{font-family:var(--display);font-size-adjust:none;font-weight:400;font-size:19px;overflow-wrap:anywhere}
.places small{display:block;color:var(--ink-soft);font-size:13px;overflow-wrap:anywhere}

/* wishes */
.wishes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wishes li{display:flex;gap:10px;align-items:flex-start;transition:transform .35s cubic-bezier(.2,.7,.2,1)}.book:not(.nohover) .wishes li:hover{transform:translateX(6px)}
.wishes label{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-family:var(--hand);font-size-adjust:none;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.wishes input{appearance:none;flex:none;width:20px;height:20px;margin-top:5px;border:1.5px solid var(--ember);border-radius:50%;cursor:pointer;transition:box-shadow .3s,transform .3s}.book:not(.nohover) .wishes li:hover input{transform:scale(1.15);box-shadow:0 0 12px rgba(var(--ember-rgb),.5)}
.wishes input:checked{background:radial-gradient(circle,var(--rose) 45%,transparent 50%);border-color:var(--rose);box-shadow:0 0 14px rgba(var(--rose-rgb),.8)}
.wishes .done span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rose)}
.thread li::after,.places li::after,.wishes li::after,.watch li::after{content:"";position:absolute;top:0;bottom:0;left:-8px;width:8px}
.places li,.wishes li,.watch li{position:relative}
/* watch list: each title is a little ticket, with a stub to tick once you have seen it */
.watch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.watch li{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:rgba(var(--rose-rgb),.08);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),background .3s,border-color .3s}.book:not(.nohover) .watch li:hover{transform:translateX(6px);background:rgba(var(--rose-rgb),.17);border-color:rgba(var(--ember-rgb),.45)}
.watch label{flex:none;display:flex;align-items:center;padding:0 13px;border-right:1px dashed rgba(var(--ember-rgb),.35);cursor:pointer}
.watch input{appearance:none;width:20px;height:20px;margin:0;border:1.5px solid var(--ember);border-radius:50%;cursor:pointer;transition:box-shadow .3s,transform .3s}.book:not(.nohover) .watch li:hover input{transform:scale(1.15);box-shadow:0 0 12px rgba(var(--ember-rgb),.5)}
.watch input:checked{background:radial-gradient(circle,var(--rose) 45%,transparent 50%);border-color:var(--rose);box-shadow:0 0 14px rgba(var(--rose-rgb),.8)}
.watch .txt{flex:1;min-width:0;padding:9px 12px;display:flex;flex-direction:column;justify-content:center}
.watch strong{font-family:var(--display);font-size-adjust:none;font-weight:400;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.watch small{color:var(--ink-soft);font-size:13px;overflow-wrap:anywhere}
.watch .stamp{align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);border:1px solid var(--rose);border-radius:4px;padding:1px 6px;transform:rotate(-4deg)}
.watch .edit{align-self:center;margin:0 8px 0 4px}
.watch .done{background:none}
.watch .done strong{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rose)}
.filler{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--ink-soft);font-style:italic}

/* tabs */
.tabs{display:flex;align-items:center;justify-content:center;gap:6px 14px;flex-wrap:wrap;padding:6px 16px 14px}
.tabs a{color:var(--ink-soft);text-decoration:none;font-size:14px;padding:4px 2px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--ember);border-color:var(--rose)}
.arrow{background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--ink);font-size:17px;line-height:1;transition:border-color .25s,color .25s,transform .25s}.arrow:hover:not([disabled]){border-color:var(--rose);color:var(--ember);transform:scale(1.1)}
.arrow[disabled]{opacity:.3;cursor:default}

/* dialog */
dialog{background:var(--night-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;width:min(440px,calc(100vw - 32px));max-height:calc(100% - 32px);box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(10,3,6,.72)}
form{display:flex;flex-direction:column;gap:14px;padding:22px}
form h2{font-size:26px}
.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-soft)}
.f[hidden]{display:none}
.f input,.f textarea{background:var(--night);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--ink);font-size:16px;width:100%}
.f textarea{min-height:96px;resize:vertical}
.f input[type=file]{padding:7px;font-size:14px}
.seg{border:0;margin:0;padding:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.seg legend{padding:0;margin-bottom:6px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label span{display:block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink);font-size:15px;transition:background .2s,border-color .2s,color .2s}
.seg input:checked + span{background:rgba(var(--rose-rgb),.3);border-color:var(--rose);color:#fff4ee}
.seg input:focus-visible + span{outline:2px solid var(--ember);outline-offset:2px}
.seg small{flex-basis:100%;font-size:13px;color:var(--ink-soft)}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.row div{display:flex;gap:10px}
#err{color:#ff9aa8;font-size:14px;margin:0}
#err:empty{display:none}
/* full-screen photo viewer */
#viewer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,2,4,.93);cursor:zoom-out;animation:vfade .25s ease-out}
#viewer[hidden]{display:none}
@keyframes vfade{from{opacity:0}}
#viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;animation:vrise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes vrise{from{transform:scale(.94);opacity:0}}
#v-img{display:block;max-width:min(94vw,1600px);max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);object-fit:contain;border:8px solid var(--paper);border-bottom-width:8px;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px rgba(var(--rose-rgb),.25);background:var(--paper)}
#viewer figcaption{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;justify-content:center;text-align:center;max-width:min(94vw,900px)}
#v-cap{font-family:var(--hand);font-size-adjust:none;font-size:30px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
#v-meta{font-size:15px;color:var(--ink-soft)}
#v-close{position:absolute;top:14px;right:14px;font-size:22px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:9;background:var(--paper);color:var(--paper-ink);padding:9px 16px;border-radius:8px;max-width:calc(100vw - 32px);font-size:14px}
#toast:empty{display:none}

/* Celestial type: carved capitals for titles, a flowing script for the handwriting, a fine old-style serif for reading */
h1,h2,h3,.brand,.toc .t b,.places strong,.watch strong,.dayno,.skymap .count{font-weight:500;letter-spacing:.035em}
.cover h1{letter-spacing:.04em;line-height:1.12}
.sec h2{font-size:clamp(21px,2.9cqw,31px);line-height:1.15}
.brand{font-size:16px}
.toc .t b{font-size:clamp(15px,1.8cqw,19px)}
.thread h3{font-size:19px;line-height:1.25}
.places strong,.watch strong{font-size:16px}
form h2{font-size:21px}
.kick,.running,.tag,.watch .stamp{font-weight:600}
.shot .cap{font-size:25px}
.note p,.wishes label{font-size:26px;line-height:1.3}
.cover .names,.ded .names{line-height:1.25}
@media (max-width:760px){
  .stage{padding:8px 16px}
  .book{width:min(100cqw,480px);height:100cqh;aspect-ratio:auto}
  .book::before,.book::after,.board-l{display:none}
  .book.closed{transform:none}
  .book.closed .glow{transform:none}
  .glow{inset:-12% 0}
  .page{padding:22px 20px 34px}
  .toc .t i{opacity:1;transform:none}
  .tabs{gap:2px 10px;padding-bottom:10px}
  .tabs a{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.glow,.star,.dayno,.enter .toc li,.book:not(.nohover) .toc a:hover .dots{animation:none}
  *{transition-duration:.01s!important}
}

<script src="config.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const book = $('book'), spread = $('spread'), dlg = $('dlg'), form = $('form');
const narrow = matchMedia('(max-width:760px)');
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

let sb = null, uid = null;   // the Supabase connection and who is signed in
let canWrite = false, loaded = false;
let items = [], settings = {};
let pages = [], pos = 0, busy = false, focusId = null;
const urlCache = new Map();   // photo path -> signed link, so each photo is fetched once
const urlReady = new Map();   // the same links once known, so a page can show its photos the moment it is built

const SECTIONS = {
  story:  {title:'Milestones',           kind:'milestone', add:'Add a milestone', per:3},
  photos: {title:'Gallery',         kind:'photo',     add:'Add a photo',     per:2},
  notes:  {title:'Notes', kind:'note',      add:'Write a note',    per:2},
  places: {title:"Travel",   kind:'place',     add:'Add a place'},
  wishes: {title:'Goals',        kind:'wish',      add:'Add a wish',      per:8},
  watch:  {title:'Watch list',          kind:'watch',     add:'Add a film or series', per:6},
};

/* ---------- small helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function s(tag, attrs, text){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const str = v => typeof v === 'string' ? v : '';
function parseDay(d){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(d)); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function fmtDay(d){ const x = parseDay(d); if (!x) return ''; let m = ''; try { m = x.toLocaleDateString('sk-SK', {month:'long'}); } catch { m = String(x.getMonth() + 1) + '.'; } return x.getDate() + '. ' + m + ' ' + x.getFullYear(); }
function today(){ const n = new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function dayNo(d){ const a = parseDay(settings.since), b = parseDay(d); if (!a || !b) return null; const n = Math.round((b - a)/864e5) + 1; return n >= 1 ? n : null; }
function names(){ const a = str(settings.a).trim(), b = str(settings.b).trim(); return a && b ? a+' & '+b : (a || b || ''); }
function byKind(k){ return items.filter(i => i.kind === k).sort((x,y) => (str(x.date)||'9').localeCompare(str(y.date)||'9') || (x.created||0)-(y.created||0)); }
function chunk(a, n){ const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i+n)); return o.length ? o : [[]]; }
let toastT; function toast(msg){ $('toast').textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => $('toast').textContent = '', 6000); }

/* ---------- photos ---------- */
function photoUrl(path){
  if (!urlCache.has(path)){
    const p = sb.storage.from('photos').createSignedUrl(path, 60*60*24*7).then(({data, error}) => {
      if (error || !data) throw error || new Error('no link');
      urlReady.set(path, data.signedUrl);
      return data.signedUrl;
    });
    p.catch(() => urlCache.delete(path));   // try again next time, for example once back online
    urlCache.set(path, p);
  }
  return urlCache.get(path);
}
/* ---------- photo shapes ---------- */
const DIMS_KEY = 'our-book-dims-v1';
const dims = new Map((() => { try { return Object.entries(JSON.parse(localStorage.getItem(DIMS_KEY) || '{}')); } catch { return []; } })());
const measured = new Set();
function photoDims(p){
  if (!p) return null;
  if (p.w > 0 && p.h > 0) return [p.w, p.h];
  return dims.get(p.path) || null;
}
/* a photo fills a page when chosen so, or, on Automatic, when it is clearly taller than wide */
function isFull(item){
  if (item.size === 'full') return true;
  if (item.size === 'half') return false;
  const d = photoDims(item.photo);
  return !!d && d[1] > d[0]*1.1;
}
let relayoutT = 0;
function relayout(){ clearTimeout(relayoutT); relayoutT = setTimeout(() => { if (busy) dirty = true; else render(); }, 150); }
/* Photos saved before this version have no size stored: measure each once, remember it on this device,
   and store it with the photo so the other phone never has to measure it again. */
function learnDims(id, w, hgt){
  const item = items.find(i => i.id === id);
  if (!item || !item.photo || !w || !hgt || photoDims(item.photo)) return;
  dims.set(item.photo.path, [w, hgt]);
  try { localStorage.setItem(DIMS_KEY, JSON.stringify(Object.fromEntries(dims))); } catch {}
  if (canWrite && sb && !measured.has(id)){
    measured.add(id);
    const {id: _, ...data} = item;
    sb.from('memories').upsert({id, data: {...data, photo: {...item.photo, w, h: hgt}}, updated_at: new Date().toISOString()}).then(() => {}, () => {});
  }
  relayout();
}
function measureMissing(){
  if (!sb) return;
  items.filter(i => i.photo && i.photo.path && !photoDims(i.photo)).forEach(i => {
    photoUrl(i.photo.path).then(u => { const im = new Image(); im.onload = () => learnDims(i.id, im.naturalWidth, im.naturalHeight); im.src = u; }, () => {});
  });
}
/* Ask for every photo's link in one go when the book loads, so pages never wait for them. */
async function signAll(){
  if (!sb) return;
  const paths = [...new Set(items.filter(i => i.photo && i.photo.path && !urlReady.has(i.photo.path)).map(i => i.photo.path))];
  if (!paths.length) return;
  try {
    const {data, error} = await sb.storage.from('photos').createSignedUrls(paths, 60*60*24*7);
    if (error || !Array.isArray(data)) return;
    data.forEach(r => { if (r && r.signedUrl && r.path){ urlReady.set(r.path, r.signedUrl); urlCache.set(r.path, Promise.resolve(r.signedUrl)); } });
  } catch {}
  prefetchAround();
}
/* Download the photos of the spreads either side of the open one, so a page turn shows them straight away. */
const fetched = new Set();
function prefetchAround(){
  if (!sb || !pages.length) return;
  const st = step();
  for (let i = Math.max(0, pos - st); i < Math.min(pages.length, pos + 2*st); i++){
    const ids = (pages[i] && pages[i].ids) || [];
    for (const id of ids){
      const it = items.find(x => x.id === id), path = it && it.photo && it.photo.path;
      if (!path || fetched.has(path)) continue;
      fetched.add(path);
      photoUrl(path).then(u => { const im = new Image(); im.decoding = 'async'; im.src = u; if (im.decode) im.decode().catch(() => {}); }, () => fetched.delete(path));
    }
  }
}
function photoBox(item, cls){
  const box = h('div', {class: cls, 'data-id': item.id});
  const p = item.photo;
  if (!p){ box.textContent = 'no photo'; return box; }
  const d = photoDims(p);
  box.dataset.ratio = d ? String(d[0]/d[1]) : String(4/3);
  const img = h('img', {alt: str(item.title) || 'Photo', decoding:'async'});
  img.addEventListener('error', () => box.classList.add('missing'));
  img.addEventListener('load', () => learnDims(item.id, img.naturalWidth, img.naturalHeight));
  if (sb && typeof p.path === 'string' && p.path){
    if (urlReady.has(p.path)) img.src = urlReady.get(p.path);
    else photoUrl(p.path).then(u => { img.src = u; }, () => box.classList.add('missing'));
  } else box.classList.add('missing');
  box.append(img);
  return box;
}
/* size every photo frame on the visible pages to its photo's shape and the room its slot has */
function fitShots(){
  spread.querySelectorAll('.slot').forEach(slot => {
    const fig = slot.firstElementChild, ph = fig && fig.querySelector('.ph'), cap = fig && fig.querySelector('figcaption');
    if (!ph || !cap) return;
    const W = slot.clientWidth, H = slot.clientHeight;
    if (!W || !H) return;
    const r = +ph.dataset.ratio || 4/3;
    let capH = 30;
    for (let k = 0; k < 3; k++){
      const pw = Math.max(60, Math.floor(Math.min(W*.95 - 18, (H*.97 - 17 - capH)*r, 720)));
      const ph_ = Math.max(45, Math.floor(pw/r));
      ph.style.width = pw + 'px'; ph.style.height = ph_ + 'px'; cap.style.width = pw + 'px';
      const c = cap.offsetHeight;
      if (Math.abs(c - capH) < 1) break;
      capH = c;
    }
  });
}
async function shrink(file, max, asData){
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error("This browser can't read that file as a photo. Try a JPG or PNG."); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width*sc)); c.height = Math.max(1, Math.round(bmp.height*sc));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (asData === 'dims') return new Promise((res, rej) => c.toBlob(b => b ? res({blob: b, w: c.width, h: c.height}) : rej(new Error('The photo could not be prepared.')), 'image/jpeg', .86));
  if (asData){
    let q = .82, u;
    do { u = c.toDataURL('image/jpeg', q); q -= .14; } while (u.length > 230000 && q > .3);
    if (u.length > 230000 && max > 300) return shrink(file, Math.round(max*.7), true);
    return u;
  }
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('The photo could not be prepared.')), 'image/jpeg', .86));
}
async function storePhoto(id, file){

const HEART = (() => {
  const S = [], L = [0], N = 720;
  for (let k = 0; k <= N; k++){
    const t = Math.PI + k/N*2*Math.PI;
    S.push([16*Math.sin(t)**3, -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))]);
    if (k) L.push(L[k-1] + Math.hypot(S[k][0]-S[k-1][0], S[k][1]-S[k-1][1]));
  }
  return f => { const target = (f % 1)*L[N]; let k = 0; while (k < N && L[k] < target) k++; return S[k]; };
})();

function fitChunks(list, draw, fallback){

  probe.style.visibility = 'hidden';

    probe.replaceChildren();

    const first = out.length === 0;

const STRIPS = 8, SAMPLES = 36, RAD = Math.PI/180;
const smooth = t => t*t*(3 - 2*t);

/* Angle of strip k of the leaf at time t (0..1): 0 is flat where it started, 180 is flat on the other side.
   Paper bends, so its free edge lifts first and lands first; a cover is a stiff board and swings in one piece. */
function leafAngle(stiff){
  if (stiff) return (k, t) => 180*smooth(smooth(t)*.5 + t*.5);
  /* The spine side comes down in step with the rest of the sheet, so the page never hovers above the book
     and then sinks (that read as a little bounce). The whole turn finishes at 90% of the time and lies still after. */
  const lift = t => { const s = smooth(t), w = smooth(Math.min(1, Math.max(0, (t - .35)/.5)));
    return Math.pow(s, 1.1)*(1 - w) + (1 - Math.pow(1 - s, 2.2))*w; };
  return (k, t) => {
    const u = Math.min(1, t/.9);
    const base = 180*lift(u);
    const bend = 62*Math.pow(Math.max(0, Math.sin(Math.PI*Math.pow(u, .85))), .9)*(1 - Math.pow(u, 6));
    return Math.min(180, base + bend*Math.pow(k/(STRIPS - 1), .85));
  };
}

/* one slice of a page, for one side of one strip */
function sliceFace(page, off, w, back, dir, W){
  const f = h('div', {class: 'sf' + (back ? ' rev' : '')});
  const c = page.cloneNode(true);
  c.classList.remove('held');
  c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  c.querySelectorAll('img').forEach(i => { i.loading = 'eager'; });
  const pad = dir > 0 ? 0 : 1;   // each face overlaps its neighbour by 1px so no seam shows between strips
  f.style.cssText = `left:${-pad}px;width:${w + 1}px`;
  if (back) f.style.transform = `translateX(${w + 2*pad}px) rotateY(180deg)`;   // flipped about its own edge, in whole pixels
  /* the copy sits in a box as wide as the open book, exactly like the real page, so anything sized
     in percent (the cover's margins, for one) comes out identical and nothing shifts when the turn starts or ends */
  const wrap = h('div', {class:'sw'});
  wrap.style.cssText = `left:${pad - off}px;width:${2*W}px`;
  c.style.cssText = 'left:0;width:50%';

  const oL = spread.querySelector(':scope > .page.left'), oR = spread.querySelector(':scope > .page.right');
  if (!oL || !oR){ dirty = true; endTurn(); return; }
  const nL = mkPage(pos, 'left'), nR = mkPage(pos + 1, 'right');
  const stiff = from === 0 || pos === 0;          // the cover is involved: it turns as a board, not as paper
  const flip = dir > 0 ? oR : oL;                 // old page on the front of the leaf
  const stay = dir > 0 ? oL : oR;                 // old page that stays put until the leaf lands on it
  const under = dir > 0 ? nR : nL;                // new page uncovered as the leaf lifts
  const land = dir > 0 ? nL : nR;                 // new page on the back of the leaf
  under.classList.add('enter'); land.classList.add('held');
  const ready = Promise.all([...land.querySelectorAll('img[src]'), ...under.querySelectorAll('img[src]')].map(i => i.decode ? i.decode().catch(() => {}) : null));   // only the page being uncovered fades its rows in; the page on the leaf is simply printed there
  spread.append(under, land);
  fitCover();
  const box = spread.getBoundingClientRect(), W = box.width/2, H = box.height, sgn = dir > 0 ? -1 : 1;
  /* the page is cut on whole pixels (X = slice edges from its left side), so every slice draws its text
     exactly where the still page draws it and nothing shifts or blurs when the turn starts or ends */
  const X = Array.from({length: STRIPS + 1}, (_, j) => j === STRIPS ? W : Math.round(j*W/STRIPS));
  const ms = stiff ? 1250 : 1050, ang = leafAngle(stiff);
  const leaf = h('div', {class:'turn ' + (dir > 0 ? 'fwd' : 'bwd'), 'aria-hidden':'true', inert:true});
  const strips = [], scrolls = [];
  let parent = leaf, prevW = 0;
  for (let k = 0; k < STRIPS; k++){
    const el = h('div', {class:'strip'});
    const j = dir > 0 ? k : STRIPS - 1 - k;       // which slice of the page this strip carries on its front
    const w = X[j + 1] - X[j];
    el.style.cssText = `width:${w}px;left:${k ? (dir > 0 ? prevW : -w) : (dir > 0 ? 0 : X[j])}px`;
    prevW = w;
    const front = sliceFace(flip, X[j], w, false, dir, W), back = sliceFace(land, W - X[j + 1], w, true, dir, W);
    scrolls.push([front.c, flip.scrollTop]);
    el.append(front.f, back.f); parent.append(el); parent = el;
    strips.push({el, front, back});
  }
  spread.append(leaf);
  scrolls.forEach(([c, y]) => { if (y) c.scrollTop = y; });
  leaf.querySelectorAll('.ph img:not([src]), .thumb img:not([src])').forEach(ci => {
    const it = items.find(x => x.id === ci.parentElement.dataset.id);
    if (it && it.photo && it.photo.path) photoUrl(it.photo.path).then(u => { ci.src = u; }, () => {});
  });
  flip.remove();

  const T = Array.from({length: SAMPLES + 1}, (_, i) => i/SAMPLES);
  const A = strips.map((_, k) => T.map(t => ang(k, t)));
  const opt = {duration: ms, fill:'forwards'};
  let main = null;
  strips.forEach((s, k) => {
    const an = s.el.animate(T.map((_, i) => ({transform:`rotateY(${num(sgn*(A[k][i] - (k ? A[k-1][i] : 0)))}deg)`})), opt);
    if (!k) main = an;
    s.front.dark.animate(A[k].map(a => ({opacity: num(a < 90 ? .62*(1 - Math.cos(a*RAD)) : .62)})), opt);
    s.back.dark.animate(A[k].map(a => ({opacity: num(a > 90 ? .62*(1 + Math.cos(a*RAD)) : .62)})), opt);
    const sheen = A[k].map(a => ({opacity: num(.085*Math.pow(Math.max(0, Math.sin(a*RAD)), 1.5))}));
    s.front.light.animate(sheen, opt); s.back.light.animate(sheen, opt);
  });
  /* shadows the leaf throws on the pages beneath: how far it reaches on each side, and how high it is */
  const reach = T.map((_, i) => { let x = 0, hi = 0, lo = 0; for (let k = 0; k < STRIPS; k++){ x += Math.cos(A[k][i]*RAD)/STRIPS; hi = Math.max(hi, x); lo = Math.min(lo, x); } return [hi, -lo]; });
  const mean = T.map((_, i) => A.reduce((sum, a) => sum + a[i], 0)/STRIPS);
  const casts = [];
  const cast = (side, far) => {
    const c = h('div', {class:'cast ' + side});
    c.animate(T.map((_, i) => {
      const m = mean[i], e = reach[i][far]*(1 + .24*Math.sin(m*RAD));
      const o = far ? (m > 90 ? .6*Math.pow(Math.max(0, Math.sin(Math.PI*(m - 90)/90)), .8) : 0) : (m < 90 ? .5*Math.sin(Math.PI*m/90) : 0);
      return {opacity: num(e > 0 ? o : 0), transform:`scaleX(${num(Math.min(1, (e + .05)/.7))})`};
    }), opt);
    spread.append(c); casts.push(c);
  };
  if (!under.classList.contains('void')) cast(dir > 0 ? 'r' : 'l', 0);
  if (!stay.classList.contains('void')) cast(dir > 0 ? 'l' : 'r', 1);
  /* the cover board under the left page folds away with the cover, so no empty left page is ever left showing */
  if (stiff){
    const k = pos === 0 ? 1 : -1;
    book.querySelector('.board-l').animate(A[0].map(a => ({transform:`scaleX(${num(Math.max(0, k*Math.cos(a*RAD)))})`})), {duration: ms});
  }
  stardust(dir, ang, ms, W, H, stiff ? 18 : 12);

  let finished = false, guard = 0;
  const swap = () => {
    stay.remove(); casts.forEach(c => c.remove());
    land.classList.remove('held'); under.classList.remove('enter');
    /* the turning copy fades out over the real page instead of vanishing in one frame,
       so tiny drawing differences between the two settle softly instead of jumping */
    let tidied = false;
    const tidy = () => { if (tidied) return; tidied = true; leaf.remove(); endTurn(); };
    const fade = leaf.animate([{opacity:1}, {opacity:0}], {duration:140, easing:'ease-out', fill:'forwards'});
    fade.onfinish = tidy; fade.oncancel = tidy;
    setTimeout(tidy, 400);
  };
  const done = () => {
    if (finished) return;
    finished = true; clearTimeout(guard);
    /* the leaf holds its final position until the page's photos are ready (a fifth of a second at most),
       then the swap happens between two frames */
    Promise.race([ready, new Promise(r => setTimeout(r, 200))]).then(() => requestAnimationFrame(swap));
  };
  main.onfinish = done; main.oncancel = done;
  guard = setTimeout(done, ms + 300);
}
function turnSingle(dir){
  const old = spread.querySelector(':scope > .page');
  if (!old){ dirty = true; endTurn(); return; }
  const nP = mkPage(pos, 'single'), ms = 800;
  const leaf = h('div', {class:'leaf one'}), front = h('div', {class:'face'}), sf = h('div', {class:'shade'});
  const away = {transform:'rotateY(-108deg) skewY(-3deg)', opacity:0}, flat = {transform:'rotateY(0deg) skewY(0deg)', opacity:1};
  const mid = off => ({transform:'rotateY(-70deg) skewY(-3deg)', opacity:1, offset:off});
  let frames;
  if (dir > 0){ front.append(old, sf); spread.append(nP); frames = [flat, mid(.7), away]; sf.animate([{opacity:0}, {opacity:.6}], {duration: ms, fill:'forwards'}); }
  else { front.append(nP, sf); frames = [away, mid(.3), flat]; sf.animate([{opacity:.6}, {opacity:0}], {duration: ms, fill:'forwards'}); }
  leaf.append(front); spread.append(leaf);
  fitCover();
  let finished = false, guard = 0;
  const done = () => {
    if (finished) return;
    finished = true; clearTimeout(guard);
    if (dir < 0){ old.remove(); spread.append(nP); }
    leaf.remove();
    endTurn();
  };
  const an = leaf.animate(frames, {duration: ms, easing:'cubic-bezier(.3,.3,.2,1)', fill:'forwards'});
  an.onfinish = done; an.oncancel = done;
  guard = setTimeout(done, ms + 300);
}
function goSection(name){
  if (busy){ queued = () => goSection(name); return; }
  const i = pages.findIndex(p => p.section === name && !p.blank);
  if (i >= 0) go(i - i % step());
}
/* links to a section (the tabs, the contents page) are handled here directly, so clicking one always works,
   including a second click on the same link */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a || dlg.open) return;
  const name = a.getAttribute('href').slice(1);
  if (name !== 'cover' && name !== 'contents' && !SECTIONS[name]) return;
  e.preventDefault();
  goSection(name);
});

/* ---------- form ---------- */
let editing = null, formKind = null, delArmed = false;
const FIELDS = {
  settings:  {title:'Names and date', show:['btitle','a','b','since']},
  milestone: {title:'A milestone',    show:['title','date','text','photo'], lt:'What was it', lx:'What happened', lp:'Photo, if you have one'},
  photo:     {title:'A photo',        show:['photo','layout','title','date'], lt:'Caption', lp:'Photo'},
  note:      {title:'A note',         show:['text','from','date'],          lx:'Your note'},
  place:     {title:'A place',        show:['title','date','text'],         lt:'Where', lx:'A line about it'},
  wish:      {title:'A wish',         show:['title'],                       lt:'Something to do together someday'},
  watch:     {title:'Something to watch', show:['title','text','from'],     lt:'Film or series', lx:'A note, like where to watch it (optional)', lf:'Picked by (optional)'},
};
function openForm(kind, item){
  formKind = kind; editing = item || null; delArmed = false;
  const F = FIELDS[kind];
  form.reset(); $('err').textContent = '';
  $('dlg-title').textContent = (item ? 'Edit: ' : '') + F.title;
  form.querySelectorAll('.f').forEach(l => l.hidden = !F.show.includes(l.dataset.f));
  $('l-title').textContent = F.lt || 'Title'; $('l-text').textContent = F.lx || 'Text';
  $('l-from').textContent = F.lf || 'From';
  $('l-photo').textContent = (F.lp || 'Photo') + (item && item.photo ? ' (leave empty to keep the current one)' : '');
  $('del').hidden = !item; $('del').textContent = 'Remove';
  $('who').replaceChildren(...[settings.a, settings.b].map(str).filter(Boolean).map(n => h('option', {value: n})));
  if (kind === 'settings'){
    $('f-btitle').value = str(settings.title); $('f-a').value = str(settings.a); $('f-b').value = str(settings.b); $('f-since').value = str(settings.since);
  } else {
    $('f-title').value = item ? str(item.title) : ''; $('f-text').value = item ? str(item.text) : '';
    $('f-from').value = item ? str(item.from) : ''; $('f-date').value = item ? str(item.date) : today();
    const lay = item && (item.size === 'full' || item.size === 'half') ? item.size : 'auto';
    $('f-lay-' + lay).checked = true;
  }
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
function closeForm(){ if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('cancel').addEventListener('click', closeForm);
$('del').addEventListener('click', async () => {
  if (!editing) return;
  if (!delArmed){ delArmed = true; $('del').textContent = 'Remove for good? Click again'; return; }
  try { await store.remove(editing); closeForm(); } catch (e){ $('err').textContent = writeFailed(e); }
});
form.addEventListener('submit', async ev => {
  ev.preventDefault();
  const F = FIELDS[formKind], v = id => $(id).value.trim(), file = $('f-photo').files[0];
  let msg = '';
  if (formKind !== 'settings'){
    if (F.show.includes('title') && formKind !== 'photo' && !v('f-title')) msg = 'Give it a few words first.';
    if (formKind === 'note' && !v('f-text')) msg = 'Write the note first.';
    if (formKind === 'photo' && !file && !(editing && editing.photo)) msg = 'Choose a photo first.';
  }
  if (msg){ $('err').textContent = msg; return; }
  $('save').disabled = true; $('save').textContent = file ? 'Saving photo…' : 'Saving…'; $('err').textContent = '';
  try {
    if (formKind === 'settings'){
      await store.saveSettings({title: v('f-btitle'), a: v('f-a'), b: v('f-b'), since: v('f-since')});
    } else {
      const id = editing ? editing.id : store.newId();
      const data = {kind: formKind, created: editing ? (editing.created || Date.now()) : Date.now()};
      if (uid) data.by = editing && editing.by ? editing.by : uid;
      if (F.show.includes('title')) data.title = v('f-title');
      if (F.show.includes('text')) data.text = v('f-text');
      if (F.show.includes('date')) data.date = v('f-date');
      if (F.show.includes('from')) data.from = v('f-from');
      if (formKind === 'wish' || formKind === 'watch') data.done = !!(editing && editing.done);
      if (F.show.includes('layout')){ const c = form.querySelector('input[name="f-layout"]:checked'); data.size = c ? c.value : 'auto'; }
      if (F.show.includes('photo')){
        if (file){
          data.photo = await storePhoto(id, file);
          if (editing && editing.photo) dropPhoto(editing.photo);
        } else if (editing && editing.photo) data.photo = editing.photo;
      }
      focusId = id;
      await store.save(id, data);

    }
    closeForm();
  } catch (e){ focusId = null; $('err').textContent = writeFailed(e); }
  finally { $('save').disabled = false; $('save').textContent = 'Save'; }
});

/* ---------- full-screen photo viewer ---------- */
const viewer = $('viewer');
let viewerFrom = null;
function openViewer(item, src){
  if (!src) return;
  viewerFrom = document.activeElement;
  $('v-img').src = src; $('v-img').alt = str(item.title) || 'Photo';
  $('v-cap').textContent = str(item.title);
  $('v-meta').textContent = fmtDay(item.date);
  viewer.hidden = false;
  $('v-close').focus();
}
function closeViewer(){
  if (viewer.hidden) return;
  viewer.hidden = true; $('v-img').removeAttribute('src');
  if (viewerFrom && viewerFrom.focus) try { viewerFrom.focus(); } catch {}
}
viewer.addEventListener('click', closeViewer);
spread.addEventListener('click', e => {
  const img = e.target.closest && e.target.closest('.ph img, .thumb img');
  if (!img || busy || img.closest('.turn, .leaf') || !img.currentSrc) return;
  const box = img.parentElement, item = items.find(i => i.id === box.dataset.id);
  if (item) openViewer(item, img.currentSrc);
});

/* ---------- navigation ---------- */
$('prev').addEventListener('click', () => go(pos - step()));
$('next').addEventListener('click', () => go(pos + step()));
document.addEventListener('keydown', e => {
  if (!viewer.hidden){ if (e.key === 'Escape'){ e.preventDefault(); closeViewer(); } return; }
  if (dlg.open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(pos + step()); else if (e.key === 'ArrowLeft') go(pos - step());
});
let tx = null;
book.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
book.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 60) go(pos + (dx < 0 ? 1 : -1)*step()); }, {passive:true});
addEventListener('hashchange', () => { const name = location.hash.slice(1); if (sectionAt(pos) !== name) goSection(name); });
narrow.addEventListener('change', () => { const sct = sectionAt(pos); pages = buildPages(); const i = pages.findIndex(p => p.section === sct && !p.blank); pos = Math.max(0, i); render(); });

/* ---------- night sky ---------- */
function paintSky(){
  const c = $('sky'), r = Math.min(devicePixelRatio || 1, 2), w = innerWidth, hh = innerHeight;
  c.width = w*r; c.height = hh*r;
  const g = c.getContext('2d'); g.scale(r, r);
  let seed = 41; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const n = Math.round(w*hh/5200);
  for (let i = 0; i < n; i++){
    const big = rnd() > .93;
    g.fillStyle = `rgba(${big ? (rnd() > .5 ? '255,150,165' : '241,196,129') : '247,231,216'},${(.15 + rnd()*.55).toFixed(2)})`;
    g.beginPath(); g.arc(rnd()*w, rnd()*hh, big ? 1.5 : .4 + rnd()*.7, 0, 7); g.fill();
  }
}
let skyT; addEventListener('resize', () => { clearTimeout(skyT); skyT = setTimeout(() => { paintSky(); if (busy) dirty = true; else render(); }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (busy) dirty = true; else render(); });

/* ---------- offline copy ---------- */
const CACHE_KEY = 'our-book-cache-v1';
function saveCache(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({items, settings, at: Date.now()})); } catch {} }
function readCache(){ try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && Array.isArray(c.items) ? c : null; } catch { return null; } }
function clearCache(){ try { localStorage.removeItem(CACHE_KEY); } catch {} }

/* ---------- connection ---------- */
const CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@';
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function supabaseLib(){
  if (window.supabase && window.supabase.createClient) return window.supabase;
  try { await loadScript(CDN + '2.47.10/dist/umd/supabase.js'); } catch {}
  if (!(window.supabase && window.supabase.createClient)) { try { await loadScript(CDN + '2/dist/umd/supabase.js'); } catch {} }
  return window.supabase && window.supabase.createClient ? window.supabase : null;
}
function status(msg){ $('status').textContent = msg; }
function offlineNote(){ status(navigator.onLine ? '' : "Offline. You can read the book; changes can't be saved until you're back online."); }

async function load(){
  const [m, b] = await Promise.all([sb.from('memories').select('id,data'), sb.from('book').select('data').eq('id', 'settings').maybeSingle()]);
  if (m.error) throw m.error;
  items = (m.data || []).map(r => ({...(r.data || {}), id: r.id})).filter(i => typeof i.kind === 'string');
  if (!b.error) settings = b.data && b.data.data ? {...b.data.data} : {};
  loaded = true; changed();
  signAll().then(measureMissing);
}
function refresh(){ if (!sb || !uid) return; load().then(offlineNote, () => offlineNote()); }

let channel = null;
function listen(){
  if (channel) return;
  channel = sb.channel('our-book')
    .on('postgres_changes', {event:'*', schema:'public', table:'memories'}, p => {
      if (p.eventType === 'DELETE') upsertLocal(p.old && p.old.id, null);
      else if (p.new && p.new.id) upsertLocal(p.new.id, p.new.data);
      changed();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'book'}, p => {
      if (p.new && p.new.id === 'settings'){ settings = {...(p.new.data || {})}; changed(); }
    })
    .subscribe(s => { if (s === 'SUBSCRIBED') refresh(); });   // also catches up after the phone has been asleep
}

function showGate(msg){
  $('gate').hidden = false; $('signout').hidden = true;
  $('gate-title').textContent = str(settings.title).trim() || 'Our Book';
  $('g-err').textContent = msg || '';
  canWrite = false; render();
  setTimeout(() => { try { $(($('g-email').value ? 'g-pass' : 'g-email')).focus(); } catch {} }, 50);
}
async function enter(session){
  uid = session.user.id;
  const mem = await sb.rpc('is_member');
  if (!mem.error && mem.data === false){
    await sb.auth.signOut();
    showGate("You're signed in as " + (session.user.email || 'someone') + ", but that email isn't on this book's members list.");
    return;
  }
  $('gate').hidden = true; $('signout').hidden = false;
  canWrite = true; render();
  listen();
  try { await load(); offlineNote(); }
  catch { loaded = true; status(readCache() ? "Can't reach the book right now. Showing it as it was last time." : "Can't reach the book right now. Check your connection."); render(); }
}

$('gate-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const email = $('g-email').value.trim(), password = $('g-pass').value;
  if (!email || !password){ $('g-err').textContent = 'Enter your email and password.'; return; }
  $('g-go').disabled = true; $('g-go').textContent = 'Opening…'; $('g-err').textContent = '';
  const {error} = await sb.auth.signInWithPassword({email, password});
  $('g-go').disabled = false; $('g-go').textContent = 'Open the book';
  if (error) $('g-err').textContent = /invalid login/i.test(error.message) ? "That email and password don't match. Check both and try again." : (navigator.onLine ? error.message : "You're offline. Connect to the internet to sign in.");
  else $('g-pass').value = '';
});
$('signout').addEventListener('click', async () => {
  if (channel){ sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut();
  uid = null; items = []; settings = {}; clearCache(); urlCache.clear();
  showGate();
});

/* ---------- install on the home screen ---------- */
let installEvent = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('install').hidden = false; });
addEventListener('appinstalled', () => { installEvent = null; $('install').hidden = true; toast('Installed. You can open the book from your home screen now.'); });
$('install').addEventListener('click', async () => {
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch {}
  installEvent = null; $('install').hidden = true;
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* Hover effects (rows sliding, photos straightening) only for a real mouse that has moved since the last
   page turn. Otherwise whatever lands under a resting pointer, or under the spot a finger last touched,
   would shift a few pixels the moment the page settles. */
const touchOnly = matchMedia('(hover: none)');
const hoverMode = () => { if (touchOnly.matches) book.classList.add('nohover'); };
hoverMode();
if (touchOnly.addEventListener) touchOnly.addEventListener('change', () => { if (!touchOnly.matches) book.classList.remove('nohover'); hoverMode(); });
addEventListener('pointermove', e => {
  if (busy || touchOnly.matches || e.pointerType !== 'mouse' || !(e.movementX || e.movementY)) return;
  book.classList.remove('nohover');
}, {passive: true});

addEventListener('online', refresh);
addEventListener('offline', offlineNote);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

/* ---------- start ---------- */
async function start(){
  const cached = readCache();
  if (cached){ items = cached.items; settings = cached.settings || {}; loaded = true; }
  paintSky(); book.style.transition = 'none'; render();
  if (location.hash.length > 1) { const nm = location.hash.slice(1); const i = pages.findIndex(p => p.section === nm && !p.blank); if (i > 0){ pos = i; render(); } }
  void book.offsetWidth; book.style.transition = '';
  const cfg = window.OUR_BOOK_CONFIG || {};
  if (!cfg.url || !cfg.anonKey || /YOUR-/.test(cfg.url + cfg.anonKey)){
    loaded = true; status('Not connected yet: add your Supabase details to config.js (see README).'); render(); return;
  }
  const lib = await supabaseLib();
  if (!lib){ loaded = true; status(cached ? "Offline. Showing the book as it was last time." : "Can't load the app. Check your connection and reopen it."); render(); return; }
  sb = lib.createClient(cfg.url, cfg.anonKey, {auth: {persistSession: true, autoRefreshToken: true}});
  const {data} = await sb.auth.getSession();
  if (data && data.session) await enter(data.session); else showGate();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && session.user.id !== uid) enter(session);
    if (event === 'SIGNED_OUT' && uid){ uid = null; showGate(); }
  });
}
start();
})();
